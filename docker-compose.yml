services:
  postgres:
    image: postgres:16-alpine
    container_name: futureforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: futureforge
      POSTGRES_PASSWORD: futureforge
      POSTGRES_DB: futureforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: futureforge-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.example
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    container_name: futureforge-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
